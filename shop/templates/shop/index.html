{% load static %}<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" id="theme-color" content="#F6F5F2">
    <meta name="description" content="{{ shop_name }} — onlayn buyurtma va yetkazib berish">
    <title>{{ shop_name }}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5A1F'/%3E%3Cstop offset='1' stop-color='%23FF2E63'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M20 26h24l-2.5 22a3 3 0 0 1-3 2.6H25.5a3 3 0 0 1-3-2.6Z M26 26v-3a6 6 0 0 1 12 0v3' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{% static 'shop/app.css' %}">
    <script>
        // Apply the saved / system theme before the first paint.
        (function () {
            try {
                var theme = JSON.parse(localStorage.getItem('shop.theme') || '"auto"');
                var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) {}
        })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    {{ config|json_script:"shop-config" }}
    <script src="{% static 'shop/app.js' %}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
</head>
<body>
{% include 'shop/_icons.html' %}

<div x-data="shop" x-cloak @keydown.escape.window="closeSheet()">

    <!-- ================= HEADER ================= -->
    <header class="header" :class="{ scrolled }">
        <div class="container header-row">
            <button class="icon-btn hide-desktop" type="button" x-show="view !== 'menu' && !inTelegram" @click="go('menu')" aria-label="Back">
                <svg class="icon"><use href="#i-chevron-left"/></svg>
            </button>
            <a class="brand" href="#" @click.prevent="go('menu')">
                <span class="logo" x-text="initial(cfg.shopName)"></span>
                <span style="min-width:0">
                    <span class="brand-name" x-text="cfg.shopName"></span>
                    <span class="brand-sub">
                        <svg class="icon"><use href="#i-clock"/></svg>
                        <span x-text="cfg.deliveryTime + ' ' + t('min')"></span>
                    </span>
                </span>
            </a>
            <nav class="nav">
                <button type="button" :class="{ on: view === 'menu' }" @click="go('menu')" x-text="t('menu')"></button>
                <button type="button" :class="{ on: view === 'orders' }" @click="go('orders')" x-text="t('orders')"></button>
            </nav>
            <div class="header-actions">
                <div class="lang-toggle hide-mobile" role="group" aria-label="Language">
                    <button type="button" :class="{ on: lang === 'uz' }" @click="setLang('uz')">UZ</button>
                    <button type="button" :class="{ on: lang === 'ru' }" @click="setLang('ru')">RU</button>
                </div>
                <button class="icon-btn hide-desktop" type="button" @click="go('orders')" :aria-label="t('orders')">
                    <svg class="icon"><use href="#i-receipt"/></svg>
                </button>
                <button class="icon-btn hide-wide" type="button" :class="{ bump }" x-show="!inTelegram" @click="openCart()" :aria-label="t('cart')">
                    <svg class="icon"><use href="#i-bag"/></svg>
                    <span class="counter" x-show="cartCount" x-text="cartCount"></span>
                </button>
                <button class="icon-btn" type="button" @click="go('profile')" :aria-label="t('profile')">
                    <template x-if="client"><span class="avatar" x-text="initial(clientName || client.phone)"></span></template>
                    <template x-if="!client"><svg class="icon"><use href="#i-user"/></svg></template>
                </button>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- ================= MENU ================= -->
        <div class="layout" x-show="view === 'menu'">
            <div>
                <section class="hero">
                    <h1 x-text="cfg.tagline || t('heroTitle')"></h1>
                    <p x-text="t('heroText')"></p>
                    <div class="hero-chips">
                        <span class="hero-chip"><svg class="icon"><use href="#i-clock"/></svg><span x-text="cfg.deliveryTime + ' ' + t('min')"></span></span>
                        <span class="hero-chip"><svg class="icon"><use href="#i-cash"/></svg><span x-text="t('cashOrCard')"></span></span>
                    </div>
                    <div class="hero-art" aria-hidden="true">
                        <template x-for="p in heroImages" :key="p.id"><img :src="p.image" alt=""></template>
                    </div>
                </section>

                <div class="toolbar">
                    <div class="search">
                        <svg class="icon"><use href="#i-search"/></svg>
                        <input type="search" x-model="search" :placeholder="t('searchPlaceholder')" enterkeyhint="search" autocomplete="off" :aria-label="t('searchPlaceholder')">
                        <button class="clear" type="button" x-show="search" @click="search = ''" aria-label="Clear"><svg class="icon icon-sm"><use href="#i-x"/></svg></button>
                    </div>
                    <div class="chips" x-ref="chips" x-show="!search && sections.length > 1">
                        <template x-for="s in sections" :key="s.id">
                            <button class="chip" type="button" :class="{ active: activeCat === s.id }" :data-id="s.id" @click="scrollToCat(s.id)" x-text="s.title"></button>
                        </template>
                    </div>
                </div>

                <!-- loading -->
                <template x-if="loading">
                    <section class="section">
                        <div class="skel" style="width:160px;height:24px;margin-bottom:14px"></div>
                        <div class="grid">
                            <template x-for="i in 8" :key="i">
                                <div class="card" style="box-shadow:none">
                                    <div class="skel" style="aspect-ratio:1"></div>
                                    <div class="skel" style="height:16px;width:60%;margin:12px 4px 6px"></div>
                                    <div class="skel" style="height:13px;width:85%;margin:0 4px 12px"></div>
                                    <div class="skel" style="height:40px"></div>
                                </div>
                            </template>
                        </div>
                    </section>
                </template>

                <!-- error -->
                <template x-if="!loading && loadError">
                    <div class="empty">
                        <div class="em">📡</div>
                        <h4 x-text="t('loadError')"></h4>
                        <p x-text="t('errNetwork')"></p>
                        <button class="btn btn-dark btn-sm" type="button" @click="load()">
                            <svg class="icon icon-sm"><use href="#i-refresh"/></svg><span x-text="t('retry')"></span>
                        </button>
                    </div>
                </template>

                <!-- search results -->
                <template x-if="!loading && !loadError && results">
                    <section class="section">
                        <h2 class="section-title"><span x-text="t('results')"></span><small x-text="results.length"></small></h2>
                        <div class="grid">
                            <template x-for="p in results" :key="'r' + p.id">{% include 'shop/_card.html' %}</template>
                        </div>
                        <div class="empty" x-show="!results.length">
                            <div class="em">🔎</div>
                            <h4 x-text="t('nothingFound')"></h4>
                            <p x-text="t('nothingFoundText')"></p>
                        </div>
                    </section>
                </template>

                <!-- catalog -->
                <template x-if="!loading && !loadError && !results">
                    <div>
                        <template x-if="popular.length >= 3">
                            <section class="section">
                                <h2 class="section-title"><svg class="icon"><use href="#i-flame"/></svg><span x-text="t('popular')"></span></h2>
                                <div class="rail">
                                    <template x-for="p in popular" :key="'p' + p.id">{% include 'shop/_card.html' %}</template>
                                </div>
                            </section>
                        </template>
                        <template x-for="s in sections" :key="s.id">
                            <section class="section" :data-cat="s.id">
                                <h2 class="section-title"><span x-text="s.title"></span><small x-text="s.products.length"></small></h2>
                                <div class="grid">
                                    <template x-for="p in s.products" :key="p.id">{% include 'shop/_card.html' %}</template>
                                </div>
                            </section>
                        </template>
                        <div class="empty" x-show="!products.length">
                            <div class="em">🍽️</div>
                            <h4 x-text="t('emptyMenu')"></h4>
                            <p x-text="t('emptyMenuText')"></p>
                        </div>
                    </div>
                </template>
            </div>

            <!-- desktop cart -->
            <aside class="aside">
                <div class="panel">
                    <div class="panel-head">
                        <h3 x-text="t('cart')"></h3>
                        <button class="btn btn-soft btn-sm" type="button" x-show="cartItems.length" @click="clearCart()">
                            <svg class="icon icon-sm"><use href="#i-trash"/></svg><span x-text="t('clear')"></span>
                        </button>
                    </div>
                    <div class="panel-body">{% include 'shop/_cart_lines.html' %}</div>
                    <div class="panel-foot" x-show="cartItems.length">
                        <div class="note" x-show="belowMinimum"><svg class="icon icon-sm"><use href="#i-info"/></svg><span x-text="t('minOrder') + ': ' + money(cfg.minOrder)"></span></div>
                        <div class="summary-total"><span x-text="t('total')"></span><span x-text="money(cartTotal)"></span></div>
                        <button class="btn btn-primary" type="button" :disabled="belowMinimum" @click="goCheckout()">
                            <span x-text="t('checkout')"></span><svg class="icon"><use href="#i-arrow-right"/></svg>
                        </button>
                    </div>
                </div>
            </aside>
        </div>

        <!-- ================= ORDERS ================= -->
        <div x-show="view === 'orders'" x-cloak>
            <div class="page-head">
                <h2 x-text="t('orders')"></h2>
                <button class="icon-btn" type="button" x-show="client" @click="loadOrders()" :aria-label="t('refresh')"><svg class="icon"><use href="#i-refresh"/></svg></button>
            </div>
            <template x-if="!client">
                <div class="empty">
                    <div class="em">🔐</div>
                    <h4 x-text="t('loginTitle')"></h4>
                    <p x-text="t('loginPrompt')"></p>
                    <button class="btn btn-primary btn-sm" type="button" @click="openAuth()" x-text="t('login')"></button>
                </div>
            </template>
            <template x-if="client && ordersLoading">
                <div class="orders-list">
                    <template x-for="i in 4" :key="i"><div class="skel" style="height:150px;border-radius:20px"></div></template>
                </div>
            </template>
            <template x-if="client && !ordersLoading && ordersLoaded && !orders.length">
                <div class="empty">
                    <div class="em">🧾</div>
                    <h4 x-text="t('ordersEmpty')"></h4>
                    <p x-text="t('ordersEmptyText')"></p>
                    <button class="btn btn-primary btn-sm" type="button" @click="go('menu')" x-text="t('toMenu')"></button>
                </div>
            </template>
            <div class="orders-list" x-show="client && !ordersLoading && orders.length">
                <template x-for="o in orders" :key="o.id">
                    <button class="order-card" type="button" @click="openOrder(o)">
                        <div class="order-top">
                            <div>
                                <div class="order-id" x-text="t('orderNo') + ' #' + o.id"></div>
                                <div class="order-date" x-text="date(o.created_at)"></div>
                            </div>
                            <span class="pill" :class="'st-' + o.status" x-text="statusText(o)"></span>
                        </div>
                        <div class="order-items-text" x-text="itemsLine(o)"></div>
                        <div class="order-bottom">
                            <div class="thumbs">
                                <template x-for="item in o.items.slice(0, 4)" :key="item.product_id">
                                    <div>
                                        <template x-if="item.image"><img :src="item.image" alt="" loading="lazy"></template>
                                        <template x-if="!item.image"><div class="ph" style="font-size:14px" x-text="initial(name(item))"></div></template>
                                    </div>
                                </template>
                                <div class="more" x-show="o.items.length > 4" x-text="'+' + (o.items.length - 4)"></div>
                            </div>
                            <div class="order-total" x-text="money(o.total)"></div>
                        </div>
                    </button>
                </template>
            </div>
        </div>

        <!-- ================= PROFILE ================= -->
        <div class="profile-wrap" x-show="view === 'profile'" x-cloak>
            <div class="page-head"><h2 x-text="t('profile')"></h2></div>
            <div class="profile-card">
                <span class="avatar" x-text="client ? initial(clientName || client.phone) : '?'"></span>
                <div style="min-width:0">
                    <h3 x-text="client ? (clientName || t('guest')) : t('guest')"></h3>
                    <p x-text="client ? (clientPhone || (client.tg_nick ? '@' + client.tg_nick : '')) : t('loginPrompt')"></p>
                </div>
            </div>
            <button class="btn btn-primary" type="button" style="margin-top:14px" x-show="!client" @click="openAuth()">
                <span x-text="t('login')"></span><svg class="icon"><use href="#i-arrow-right"/></svg>
            </button>
            <div class="menu-list">
                <button class="menu-row" type="button" x-show="client" @click="go('orders')">
                    <span class="ic"><svg class="icon"><use href="#i-receipt"/></svg></span>
                    <span x-text="t('orders')"></span>
                    <span class="val"><svg class="icon icon-sm"><use href="#i-chevron-right"/></svg></span>
                </button>
                <div class="menu-row">
                    <span class="ic"><svg class="icon"><use href="#i-globe"/></svg></span>
                    <span x-text="t('language')"></span>
                    <span class="val">
                        <span class="lang-toggle">
                            <button type="button" :class="{ on: lang === 'uz' }" @click="setLang('uz')">O‘zbekcha</button>
                            <button type="button" :class="{ on: lang === 'ru' }" @click="setLang('ru')">Русский</button>
                        </span>
                    </span>
                </div>
                <button class="menu-row" type="button" @click="cycleTheme()">
                    <span class="ic"><svg class="icon"><use href="#i-moon"/></svg></span>
                    <span x-text="t('theme')"></span>
                    <span class="val"><span x-text="t('theme_' + theme)"></span><svg class="icon icon-sm"><use href="#i-chevron-right"/></svg></span>
                </button>
                <a class="menu-row" x-show="cfg.supportPhone" :href="'tel:' + cfg.supportPhone">
                    <span class="ic"><svg class="icon"><use href="#i-phone"/></svg></span>
                    <span x-text="t('support')"></span>
                    <span class="val" x-text="cfg.supportPhone"></span>
                </a>
                <div class="menu-row" x-show="client && client.telegram">
                    <span class="ic" style="color:var(--tg)"><svg class="icon"><use href="#i-telegram"/></svg></span>
                    <span x-text="t('telegramAccount')"></span>
                    <span class="val" style="color:var(--green)"><svg class="icon icon-sm"><use href="#i-check"/></svg><span x-text="client && client.tg_nick ? '@' + client.tg_nick : t('connected')"></span></span>
                </div>
            </div>
            <div class="menu-list" x-show="client && !inTelegram">
                <button class="menu-row danger" type="button" @click="logout()">
                    <span class="ic"><svg class="icon"><use href="#i-logout"/></svg></span>
                    <span x-text="t('logout')"></span>
                </button>
            </div>
        </div>
    </main>

    <!-- ================= FLOATING CART (mobile web) ================= -->
    <button class="cartbar" type="button" x-show="view === 'menu' && cartCount && !sheet"
            x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from"
            :class="{ bump }" @click="openCart()">
        <span class="bag"><svg class="icon"><use href="#i-bag"/></svg><b x-text="cartCount"></b></span>
        <span x-text="t('cart')"></span>
        <span class="total"><span x-text="money(cartTotal)"></span><svg class="icon icon-sm"><use href="#i-arrow-right"/></svg></span>
    </button>

    <!-- ================= SHEETS ================= -->
    <div class="backdrop" x-show="sheet" @click="closeSheet()"
         x-transition:enter="fade-in" x-transition:enter-start="fade-from" x-transition:leave="fade-out" x-transition:leave-end="fade-from"></div>

    <!-- product -->
    <div class="sheet-wrap" x-show="sheet === 'product'"
         x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from">
        <div class="sheet" role="dialog" aria-modal="true">
            <template x-if="product">
                <div style="display:flex;flex-direction:column;min-height:0;overflow:auto">
                    <div class="pd-media">
                        <template x-if="product.image"><img :src="product.image" :alt="name(product)"></template>
                        <template x-if="!product.image"><div class="ph" x-text="initial(name(product))"></div></template>
                        <button class="pd-close" type="button" @click="closeSheet()" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
                    </div>
                    <div class="pd-body">
                        <h2 class="pd-title" x-text="name(product)"></h2>
                        <div class="pd-meta">
                            <span class="pd-price" x-text="money(product.price)"></span>
                            <span class="pd-unit" x-show="unit(product)" x-text="'1 ' + unit(product)"></span>
                        </div>
                        <p class="pd-desc" x-show="desc(product)" x-text="desc(product)"></p>
                    </div>
                </div>
            </template>
            <div class="sheet-foot">
                <div class="pd-actions" :style="inTelegram ? 'justify-content:center' : ''">
                    <div class="qty-lg">
                        <button type="button" @click="productQty = Math.max(1, productQty - 1)" aria-label="−"><svg class="icon"><use href="#i-minus"/></svg></button>
                        <span x-text="productQty"></span>
                        <button type="button" @click="productQty = Math.min(99, productQty + 1)" aria-label="+"><svg class="icon"><use href="#i-plus"/></svg></button>
                    </div>
                    <button class="btn btn-primary" type="button" x-show="!inTelegram" @click="addFromSheet()">
                        <span class="between" x-text="product && qty(product.id) ? t('update') : t('addToCart')"></span>
                        <span x-text="product ? money(product.price * productQty) : ''"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- cart -->
    <div class="sheet-wrap" x-show="sheet === 'cart'"
         x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from">
        <div class="sheet" role="dialog" aria-modal="true">
            <div class="sheet-grabber"></div>
            <div class="sheet-head">
                <h2 x-text="t('cart')"></h2>
                <div style="display:flex;gap:8px;align-items:center">
                    <button class="btn btn-soft btn-sm" type="button" x-show="cartItems.length" @click="clearCart()">
                        <svg class="icon icon-sm"><use href="#i-trash"/></svg><span x-text="t('clear')"></span>
                    </button>
                    <button class="close-btn" type="button" @click="closeSheet()" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
                </div>
            </div>
            <div class="sheet-body">{% include 'shop/_cart_lines.html' %}</div>
            <div class="sheet-foot" x-show="cartItems.length">
                <div class="note" x-show="belowMinimum"><svg class="icon icon-sm"><use href="#i-info"/></svg><span x-text="t('minOrder') + ': ' + money(cfg.minOrder)"></span></div>
                <div class="summary-total"><span x-text="t('total')"></span><span x-text="money(cartTotal)"></span></div>
                <button class="btn btn-primary" type="button" x-show="!inTelegram" :disabled="belowMinimum" @click="goCheckout()">
                    <span x-text="t('checkout')"></span><svg class="icon"><use href="#i-arrow-right"/></svg>
                </button>
            </div>
            <div class="sheet-foot" x-show="!cartItems.length">
                <button class="btn btn-soft" type="button" @click="closeSheet()" x-text="t('toMenu')"></button>
            </div>
        </div>
    </div>

    <!-- checkout -->
    <div class="sheet-wrap" x-show="sheet === 'checkout'"
         x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from">
        <div class="sheet" role="dialog" aria-modal="true">
            <div class="sheet-grabber"></div>
            <div class="sheet-head">
                <h2 x-text="t('checkoutTitle')"></h2>
                <button class="close-btn" type="button" @click="closeSheet()" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
            </div>
            <form class="sheet-body" @submit.prevent="placeOrder()" novalidate>
                <div class="group-label" x-text="t('receive')"></div>
                <div class="segmented">
                    <button type="button" :class="{ on: form.delivery_type === 'delivery' }" @click="form.delivery_type = 'delivery'">
                        <svg class="icon"><use href="#i-truck"/></svg><span x-text="t('delivery')"></span>
                    </button>
                    <button type="button" :class="{ on: form.delivery_type === 'pickup' }" @click="form.delivery_type = 'pickup'; errors.address = ''">
                        <svg class="icon"><use href="#i-store"/></svg><span x-text="t('pickup')"></span>
                    </button>
                </div>
                <div class="field" style="margin-top:14px" x-show="form.delivery_type === 'delivery'">
                    <label class="label" for="checkout-address" x-text="t('address')"></label>
                    <textarea id="checkout-address" class="input" rows="2" x-model="form.address" :class="{ invalid: errors.address }"
                              :placeholder="t('addressPlaceholder')" @input="errors.address = ''" autocomplete="street-address"></textarea>
                    <div class="row-actions">
                        <button class="pill-btn" type="button" x-show="!form.lat" :disabled="locating" @click="locate()">
                            <template x-if="!locating"><svg class="icon"><use href="#i-locate"/></svg></template>
                            <template x-if="locating"><span class="spinner" style="width:14px;height:14px;border-width:2px"></span></template>
                            <span x-text="locating ? t('locating') : t('locate')"></span>
                        </button>
                        <span class="geo-chip" x-show="form.lat">
                            <svg class="icon icon-sm"><use href="#i-pin"/></svg>
                            <span x-text="t('locationSet')"></span>·<a :href="mapUrl" target="_blank" rel="noopener" x-text="t('onMap')"></a>
                            <button type="button" @click="clearLocation()" aria-label="Remove"><svg class="icon icon-sm"><use href="#i-x"/></svg></button>
                        </span>
                    </div>
                    <div class="field-error" x-show="errors.address" x-text="errors.address"></div>
                </div>
                <div class="note" style="margin-top:14px;background:var(--blue-soft);color:var(--blue)" x-show="form.delivery_type === 'pickup'">
                    <svg class="icon icon-sm"><use href="#i-info"/></svg><span x-text="t('pickupNote')"></span>
                </div>

                <div class="group-label" x-text="t('contact')"></div>
                <div class="field">
                    <label class="label" for="checkout-name" x-text="t('yourName')"></label>
                    <input id="checkout-name" class="input" type="text" x-model="form.name" :class="{ invalid: errors.name }" @input="errors.name = ''" autocomplete="name">
                    <div class="field-error" x-show="errors.name" x-text="errors.name"></div>
                </div>
                <div class="field">
                    <label class="label" for="checkout-phone" x-text="t('phone')"></label>
                    <input id="checkout-phone" class="input" type="tel" inputmode="tel" x-model="form.phone" :class="{ invalid: errors.phone }"
                           @input="errors.phone = ''" placeholder="+998 90 123 45 67" autocomplete="tel">
                    <div class="row-actions" x-show="inTelegram">
                        <button class="pill-btn neutral" type="button" @click="shareTelegramPhone()">
                            <svg class="icon" style="color:var(--tg)"><use href="#i-telegram"/></svg><span x-text="t('shareTgPhone')"></span>
                        </button>
                    </div>
                    <div class="field-error" x-show="errors.phone" x-text="errors.phone"></div>
                </div>

                <div class="group-label" x-text="t('payment')"></div>
                <div class="segmented">
                    <button type="button" :class="{ on: form.payment_method === 'cash' }" @click="form.payment_method = 'cash'">
                        <svg class="icon"><use href="#i-cash"/></svg><span x-text="t('cash')"></span>
                    </button>
                    <button type="button" :class="{ on: form.payment_method === 'card' }" @click="form.payment_method = 'card'">
                        <svg class="icon"><use href="#i-card"/></svg><span x-text="t('card')"></span>
                    </button>
                </div>
                <div class="unit" style="margin-top:8px" x-text="t('paymentNote')"></div>

                <div class="group-label" x-text="t('comment')"></div>
                <textarea class="input" rows="2" x-model="form.comment" :placeholder="t('commentPlaceholder')" maxlength="1000"></textarea>

                <div class="order-summary">
                    <div class="summary-row"><span x-text="t('products') + ' · ' + cartCount + ' ' + t('pcs')"></span><span x-text="money(cartTotal)"></span></div>
                    <div class="summary-total" style="margin:4px 0 0"><span x-text="t('total')"></span><span x-text="money(cartTotal)"></span></div>
                </div>
                <button type="submit" class="sr-only" tabindex="-1">submit</button>
            </form>
            <div class="sheet-foot" x-show="!inTelegram">
                <button class="btn btn-primary" type="button" :disabled="placing" @click="placeOrder()">
                    <template x-if="placing"><span class="spinner"></span></template>
                    <template x-if="!placing"><span class="between" x-text="t('placeOrder')"></span></template>
                    <span x-show="!placing" x-text="money(cartTotal)"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- auth -->
    <div class="sheet-wrap" x-show="sheet === 'auth'"
         x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from">
        <div class="sheet" role="dialog" aria-modal="true">
            <div class="sheet-grabber"></div>
            <div class="sheet-head">
                <button class="close-btn" type="button" :style="['phone', 'code', 'telegram'].includes(auth.step) ? '' : 'visibility:hidden'"
                        @click="auth.step = auth.step === 'code' ? 'phone' : 'choose'; auth.error = ''" aria-label="Back">
                    <svg class="icon"><use href="#i-chevron-left"/></svg>
                </button>
                <button class="close-btn" type="button" @click="closeSheet()" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
            </div>
            <div class="sheet-body" style="padding-bottom:28px">
                <div x-show="auth.step === 'choose'">
                    <div class="auth-hero"><svg class="icon"><use href="#i-user"/></svg></div>
                    <h2 class="auth-title" x-text="t('loginTitle')"></h2>
                    <p class="auth-text" x-text="t('loginText')"></p>
                    <button class="btn btn-tg" type="button" :disabled="auth.loading" @click="telegramLogin()">
                        <template x-if="auth.loading"><span class="spinner"></span></template>
                        <template x-if="!auth.loading"><svg class="icon"><use href="#i-telegram"/></svg></template>
                        <span x-text="t('viaTelegram')"></span>
                    </button>
                    <div class="divider" x-text="t('or')"></div>
                    <button class="btn btn-soft" type="button" @click="auth.step = 'phone'; auth.error = ''; $nextTick(() => $refs.phoneInput.focus())">
                        <svg class="icon"><use href="#i-smartphone"/></svg><span x-text="t('viaPhone')"></span>
                    </button>
                </div>

                <form x-show="auth.step === 'phone'" @submit.prevent="requestCode()">
                    <div class="auth-hero"><svg class="icon"><use href="#i-smartphone"/></svg></div>
                    <h2 class="auth-title" x-text="t('phoneTitle')"></h2>
                    <p class="auth-text" x-text="t('phoneText')"></p>
                    <label class="phone-field">
                        <span class="prefix">+998</span>
                        <input x-ref="phoneInput" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="90 123 45 67"
                               :value="auth.phone" @input="onPhoneInput($event)" :aria-label="t('phone')">
                    </label>
                    <button class="btn btn-primary" type="submit" style="margin-top:14px" :disabled="auth.loading || authDigits.length !== 9">
                        <template x-if="auth.loading"><span class="spinner"></span></template>
                        <span x-show="!auth.loading" x-text="t('getCode')"></span>
                    </button>
                </form>

                <div x-show="auth.step === 'code'">
                    <div class="auth-hero"><svg class="icon"><use href="#i-message"/></svg></div>
                    <h2 class="auth-title" x-text="t('codeTitle')"></h2>
                    <p class="auth-text"><span x-text="t('codeSentTo')"></span> <b style="color:var(--ink)" x-text="'+998 ' + auth.phone"></b></p>
                    <div class="otp" @click="$refs.otp.focus()">
                        <template x-for="i in 6" :key="i">
                            <div class="otp-box" :class="{ active: auth.code.length === i - 1 && !auth.loading, error: auth.error }" x-text="auth.code[i - 1] || ''"></div>
                        </template>
                        <input x-ref="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                               x-model="auth.code" @input="onCodeInput()" :aria-label="t('codeTitle')">
                    </div>
                    <div class="dev-code" x-show="auth.debugCode"><span x-text="t('devCode')"></span> <b x-text="auth.debugCode"></b></div>
                    <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;min-height:32px">
                        <template x-if="auth.loading"><span class="spinner" style="color:var(--brand)"></span></template>
                        <template x-if="!auth.loading && auth.resendIn > 0">
                            <span class="unit" x-text="t('resendIn') + ' 0:' + String(auth.resendIn).padStart(2, '0')"></span>
                        </template>
                        <template x-if="!auth.loading && auth.resendIn <= 0">
                            <button class="btn btn-link" type="button" @click="requestCode()" x-text="t('resend')"></button>
                        </template>
                    </div>
                </div>

                <div x-show="auth.step === 'telegram'" style="text-align:center">
                    <div class="auth-hero tg pulse-ring"><svg class="icon"><use href="#i-telegram"/></svg></div>
                    <h2 class="auth-title" x-text="t('tgTitle')"></h2>
                    <p class="auth-text" x-text="t('tgText')"></p>
                    <a class="btn btn-tg" :href="auth.tgUrl" target="_blank" rel="noopener">
                        <svg class="icon"><use href="#i-telegram"/></svg><span x-text="t('openTelegram')"></span>
                    </a>
                    <div class="unit" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px" x-show="!auth.error">
                        <span class="spinner" style="width:14px;height:14px;border-width:2px"></span><span x-text="t('waiting')"></span>
                    </div>
                    <button class="btn btn-soft" type="button" style="margin-top:12px" x-show="auth.error" @click="telegramLogin()" x-text="t('tryAgain')"></button>
                </div>

                <form x-show="auth.step === 'name'" @submit.prevent="saveName()">
                    <div class="auth-hero"><svg class="icon"><use href="#i-user"/></svg></div>
                    <h2 class="auth-title" x-text="t('nameTitle')"></h2>
                    <p class="auth-text" x-text="t('nameText')"></p>
                    <input class="input" x-ref="nameInput" type="text" x-model="auth.name" autocomplete="name" :placeholder="t('yourName')" maxlength="100">
                    <button class="btn btn-primary" type="submit" style="margin-top:14px" :disabled="auth.loading || !auth.name.trim()">
                        <span x-text="t('continue')"></span><svg class="icon"><use href="#i-arrow-right"/></svg>
                    </button>
                </form>

                <div class="form-error" x-show="auth.error" x-text="auth.error"></div>
            </div>
        </div>
    </div>

    <!-- order detail -->
    <div class="sheet-wrap" x-show="sheet === 'order'"
         x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from">
        <div class="sheet" role="dialog" aria-modal="true">
            <div class="sheet-grabber"></div>
            <template x-if="order">
                <div style="display:flex;flex-direction:column;min-height:0;flex:1">
                    <div class="sheet-head">
                        <div>
                            <h2 x-text="t('orderNo') + ' #' + order.id"></h2>
                            <div class="order-date" x-text="date(order.created_at)"></div>
                        </div>
                        <button class="close-btn" type="button" @click="closeSheet()" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
                    </div>
                    <div class="sheet-body">
                        <div class="tracker" x-show="order.status !== 'rejected'">
                            <template x-for="step in steps(order)" :key="step">
                                <div class="step" :class="stepState(order, step)">
                                    <div class="dot"><svg class="icon"><use :href="stepIcon(order, step)"/></svg></div>
                                    <span x-text="stepLabel(order, step)"></span>
                                </div>
                            </template>
                        </div>
                        <div class="rejected-banner" x-show="order.status === 'rejected'">
                            <svg class="icon"><use href="#i-alert"/></svg><span x-text="t('rejectedText')"></span>
                        </div>
                        <template x-for="item in order.items" :key="item.product_id">
                            <div class="line" style="padding-left:0;padding-right:0">
                                <div class="line-img">
                                    <template x-if="item.image"><img :src="item.image" alt="" loading="lazy"></template>
                                    <template x-if="!item.image"><div class="ph" x-text="initial(name(item))"></div></template>
                                </div>
                                <div class="line-info">
                                    <div class="line-name" x-text="name(item)"></div>
                                    <div class="line-price" x-text="item.quantity + ' × ' + money(item.price)"></div>
                                </div>
                                <b x-text="money(item.total)"></b>
                            </div>
                        </template>
                        <div class="order-summary">
                            <div class="summary-total" style="margin:0"><span x-text="t('total')"></span><span x-text="money(order.total)"></span></div>
                        </div>
                        <div class="kv" style="margin-top:16px">
                            <div class="kv-row">
                                <svg class="icon"><use :href="order.delivery_type === 'pickup' ? '#i-store' : '#i-pin'"/></svg>
                                <div>
                                    <b x-text="order.delivery_type === 'pickup' ? t('pickup') : t('delivery')"></b>
                                    <span x-text="order.address || (order.lat ? t('locationSet') : '—')" x-show="order.delivery_type !== 'pickup'"></span>
                                </div>
                            </div>
                            <div class="kv-row" x-show="order.phone">
                                <svg class="icon"><use href="#i-phone"/></svg>
                                <div><b x-text="t('phone')"></b><span x-text="phone(order.phone)"></span></div>
                            </div>
                            <div class="kv-row" x-show="order.payment_method">
                                <svg class="icon"><use :href="order.payment_method === 'card' ? '#i-card' : '#i-cash'"/></svg>
                                <div><b x-text="t('payment')"></b><span x-text="order.payment_method === 'card' ? t('card') : t('cash')"></span></div>
                            </div>
                            <div class="kv-row" x-show="order.comment">
                                <svg class="icon"><use href="#i-message"/></svg>
                                <div><b x-text="t('comment')"></b><span x-text="order.comment"></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="sheet-foot">
                        <button class="btn btn-soft" type="button" @click="reorder(order)">
                            <svg class="icon"><use href="#i-refresh"/></svg><span x-text="t('reorder')"></span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- success -->
    <div class="sheet-wrap" x-show="sheet === 'success'"
         x-transition:enter="sheet-in" x-transition:enter-start="sheet-from" x-transition:leave="sheet-out" x-transition:leave-end="sheet-from">
        <div class="sheet" role="dialog" aria-modal="true">
            <div class="sheet-grabber"></div>
            <template x-if="sheet === 'success' && lastOrder">
                <div class="sheet-body" style="text-align:center;padding-top:18px">
                    <div class="success-circle"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
                    <h2 class="auth-title" x-text="t('orderPlaced')"></h2>
                    <p class="auth-text" x-text="t('orderPlacedText')"></p>
                    <div class="order-summary" style="text-align:left;margin-top:0">
                        <div class="summary-row"><span x-text="t('orderNo')"></span><b style="color:var(--ink)" x-text="'#' + lastOrder.id"></b></div>
                        <div class="summary-row"><span x-text="t('products')"></span><span x-text="lastOrder.items.length"></span></div>
                        <div class="summary-total" style="margin:6px 0 0"><span x-text="t('total')"></span><span x-text="money(lastOrder.total)"></span></div>
                    </div>
                </div>
            </template>
            <div class="sheet-foot" style="display:grid;gap:8px">
                <button class="btn btn-primary" type="button" @click="trackLastOrder()">
                    <svg class="icon"><use href="#i-receipt"/></svg><span x-text="t('trackOrder')"></span>
                </button>
                <button class="btn btn-soft" type="button" @click="closeSheet()" x-text="t('backToMenu')"></button>
            </div>
        </div>
    </div>

    <!-- ================= TOASTS ================= -->
    <div class="toasts" aria-live="polite">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="toast" :class="toast.type"
                 x-transition:enter="fade-in" x-transition:enter-start="fade-from" x-transition:leave="fade-out" x-transition:leave-end="fade-from">
                <svg class="icon"><use :href="toast.type === 'error' ? '#i-alert' : toast.type === 'success' ? '#i-check' : '#i-info'"/></svg>
                <span x-text="toast.text"></span>
            </div>
        </template>
    </div>
</div>
</body>
</html>
