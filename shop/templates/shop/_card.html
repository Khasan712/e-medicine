<article class="card">
    <div class="card-media" @click="openProduct(p)">
        <template x-if="p.image"><img :src="p.image" :alt="name(p)" loading="lazy" decoding="async"></template>
        <template x-if="!p.image"><div class="ph" x-text="initial(name(p))"></div></template>
        <span class="tag" x-show="isPopular(p)"><svg class="icon"><use href="#i-flame"/></svg><span x-text="t('top')"></span></span>
    </div>
    <div class="card-body" @click="openProduct(p)">
        <div class="price" x-text="money(p.price)"></div>
        <div class="pname" x-text="name(p)"></div>
        <div class="unit" x-text="unit(p) ? '1 ' + unit(p) : ''"></div>
    </div>
    <template x-if="!qty(p.id)">
        <button class="add-btn" type="button" @click="add(p)">
            <svg class="icon icon-sm"><use href="#i-plus"/></svg><span x-text="t('add')"></span>
        </button>
    </template>
    <template x-if="qty(p.id)">
        <div class="stepper">
            <button type="button" @click="dec(p)" aria-label="−"><svg class="icon icon-sm"><use href="#i-minus"/></svg></button>
            <span x-text="qty(p.id)"></span>
            <button type="button" @click="add(p)" aria-label="+"><svg class="icon icon-sm"><use href="#i-plus"/></svg></button>
        </div>
    </template>
</article>
