<div x-data="{ open: true }" x-show="open" x-cloak class="fixed inset-0 z-50 overflow-y-auto" @keydown.escape.window="open = false; $el.remove()">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-500 dark:bg-gray-900 bg-opacity-75 dark:bg-opacity-80 transition-opacity" @click="open = false; $el.parentElement.parentElement.remove()"></div>

        <!-- Modal Panel -->
        <div class="relative inline-block bg-white dark:bg-dark-card rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:w-full sm:max-w-lg">
            <form method="post"
                  hx-post="{% if category %}{% url 'dashboard:category_edit' category.id %}{% else %}{% url 'dashboard:category_create' %}{% endif %}"
                  hx-swap="outerHTML">
                {% csrf_token %}

                <div class="px-6 py-4 border-b border-gray-100 dark:border-dark-border">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ title }}</h3>
                        <button type="button" @click="open = false; $el.closest('[x-data]').remove()" class="text-gray-400 hover:text-gray-500 dark:text-gray-500 dark:hover:text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="px-6 py-4 space-y-4">
                    <div>
                        <label for="id_name_uz" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Name (Uzbek) *</label>
                        {{ form.name_uz }}
                        {% if form.name_uz.errors %}
                        <p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ form.name_uz.errors.0 }}</p>
                        {% endif %}
                    </div>
                    <div>
                        <label for="id_name_ru" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Name (Russian) *</label>
                        {{ form.name_ru }}
                        {% if form.name_ru.errors %}
                        <p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ form.name_ru.errors.0 }}</p>
                        {% endif %}
                    </div>
                </div>

                <div class="px-6 py-4 bg-gray-50 dark:bg-slate-800 flex justify-end space-x-3">
                    <button type="button"
                            @click="open = false; $el.closest('[x-data]').remove()"
                            class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-dark-card border border-gray-300 dark:border-dark-border rounded-lg hover:bg-gray-50 dark:hover:bg-dark-hover">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700">
                        {% if category %}Save Changes{% else %}Create Category{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
