{% load dashboard_tags %}

<div id="status-container">
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">{% t 'current_status' %}</label>
    <select name="status"
            class="w-full px-4 py-2.5 border border-gray-300 dark:border-dark-border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent bg-white dark:bg-slate-800 dark:text-gray-200"
            hx-post="{% url 'dashboard:order_update_status' order.id %}"
            hx-trigger="change"
            hx-swap="none">
        {% for status in form.fields.status.choices %}
        <option value="{{ status.0 }}" {% if order.status == status.0 %}selected{% endif %}>
            {% status_label status.0 %}
        </option>
        {% endfor %}
    </select>

    <div class="mt-4 pt-4 border-t border-gray-100 dark:border-dark-border">
        <span class="inline-flex px-3 py-1.5 text-sm font-medium rounded-full {{ order.status|status_class }}">
            {% status_label order.status %}
        </span>
        <p class="text-xs text-green-600 dark:text-green-400 mt-2">{% t 'status_updated' %}</p>
    </div>
</div>
