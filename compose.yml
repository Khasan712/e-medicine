services:
  app:
    build:
      context: .
    container_name: "e_medicine_app"
    restart: always
    command: bash entrypoint.sh
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis_e_medicine
    ports:
      - 9092:9092

  db:
    image: postgres:16
    container_name: "e_medicine_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    ports:
      - 5439:5432

  bot:
    build:
      context: ./bot  # Path to the bot's directory
    container_name: "e_medicine_bot"
    restart: always
    command: python bot.py  # Ensure bot starts correctly
    volumes:
      - ./bot:/bot  # Mount bot directory
    working_dir: /bot  # Ensure bot runs from its directory
    env_file:
      - .env  # Use the same env file as Django
    depends_on:
      - db  # Ensure DB is ready before starting bot
      - redis_e_medicine
    networks:
      - default  # Connects to the same Docker network

  redis_e_medicine:
    image: redis:7-alpine
    container_name: "e_medicine_redis"
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6383:6379"
    volumes:
      - redis_data_e_medicine:/data

volumes:
  postgres_data:
  redis_data_e_medicine:
